# | Configures the NetSigner plug-in for Renew.
# | This plug-in enhances Renew as functionality extension.
# | This file is generated from a template (de/renew/plugindevelopment/src/main/resources/templates/standard/plugin.cfg.vm)
# | with the PluginDevelopment Plugin (version 0.4.1).
# | However, it may be edited / cutomized.
# +-------------------------------------------------------------------

# Fixed properties of the plugin
# ------------------------------
name = Renew NetSigner
mainClass = de.renew.netsigner.api.NetSignerPluginApi
provides = de.renew.netsigner
requires = ch.ifa.draw,de.renew.gui,de.renew.util,de.renew.simulator
version = 0.2.0

# User-configurable plugin properties
# -----------------------------------
de.renew.netsigner.useX509Signer = true
de.renew.netsigner.checkCertificatesOnline = true
de.renew.netsigner.trustAnchors = <not set>
de.renew.netsigner.trustAnchorPassword = <not set>
de.renew.netsigner.keyStorePath = config/signing.jks
de.renew.netsigner.keyName = mycert
de.renew.netsigner.keystorePassword = <not set>
de.renew.netsigner.keyPassword = <not set>
de.renew.netsigner.interactiveConsole = false